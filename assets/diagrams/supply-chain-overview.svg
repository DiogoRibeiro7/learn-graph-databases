<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360">
  <style>
    .node { fill: #e8f4f8; stroke: #2b8cbe; stroke-width: 2px; }
    .label { font: 14px sans-serif; fill: #333; }
    .small { font: 12px sans-serif; fill: #333; }
    .arrow { fill: none; stroke: #333; stroke-width: 2px; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <rect x="32" y="40" width="160" height="72" rx="14" class="node" />
  <text x="112" y="64" text-anchor="middle" class="label">Supplier</text>
  <text x="112" y="84" text-anchor="middle" class="small">supplierId, name</text>

  <rect x="280" y="40" width="160" height="72" rx="14" class="node" />
  <text x="360" y="64" text-anchor="middle" class="label">Component</text>
  <text x="360" y="84" text-anchor="middle" class="small">componentId, name</text>

  <rect x="528" y="40" width="160" height="72" rx="14" class="node" />
  <text x="608" y="64" text-anchor="middle" class="label">Factory</text>
  <text x="608" y="84" text-anchor="middle" class="small">factoryId, name</text>

  <path d="M192 70 H280" class="arrow" />
  <text x="236" y="58" text-anchor="middle" class="small">SUPPLIES</text>

  <path d="M440 70 H528" class="arrow" />
  <text x="484" y="58" text-anchor="middle" class="small">USES</text>

  <text x="380" y="24" text-anchor="middle" class="label">Supply chain overview</text>
</svg>
